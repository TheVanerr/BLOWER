<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blower Air Knife Hesabı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#f3f3f0; --surface:#fcfcfb; --surface-2:#f0efec; --surface-3:#e8e7e3; --border:#e4e3de; --border-strong:#cfcec8;
  --text:#0b0b0b; --text-2:#52514e; --muted:#7a7974;
  --accent:#2a78d6; --accent-2:#184f95; --accent-soft:#e3eefb; --on-accent:#ffffff;
  --side:#0f1a2b; --side-2:#17253b; --side-text:#e9eef6; --side-muted:#93a1b5; --side-border:#22324b;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --grid:#e8e7e3;
  --good:#1f8a4c; --good-soft:#e4f4ea; --warn:#a86a00; --warn-soft:#fdf1d8; --crit:#c8302f; --crit-soft:#fbe5e4; --info-soft:#e8eef8;
  --heat:#eb6834; --heat-soft:#fdebe3;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#111110; --surface:#1a1a19; --surface-2:#232321; --surface-3:#2b2b29; --border:#2c2c29; --border-strong:#3c3c38;
    --text:#ffffff; --text-2:#c3c2b7; --muted:#8f8e86;
    --accent:#3987e5; --accent-2:#86b6ef; --accent-soft:#1b2b40; --on-accent:#ffffff;
    --side:#0b0f16; --side-2:#141b26; --side-text:#e9eef6; --side-muted:#8b97a8; --side-border:#1d2633;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --grid:#2a2a27;
    --good:#4cc27e; --good-soft:#16291e; --warn:#e2a93a; --warn-soft:#2e2412; --crit:#ef6b6a; --crit-soft:#331817; --info-soft:#1b2433;
    --heat:#d95926; --heat-soft:#32201a;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#111110; --surface:#1a1a19; --surface-2:#232321; --surface-3:#2b2b29; --border:#2c2c29; --border-strong:#3c3c38;
  --text:#ffffff; --text-2:#c3c2b7; --muted:#8f8e86;
  --accent:#3987e5; --accent-2:#86b6ef; --accent-soft:#1b2b40; --on-accent:#ffffff;
  --side:#0b0f16; --side-2:#141b26; --side-text:#e9eef6; --side-muted:#8b97a8; --side-border:#1d2633;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --grid:#2a2a27;
  --good:#4cc27e; --good-soft:#16291e; --warn:#e2a93a; --warn-soft:#2e2412; --crit:#ef6b6a; --crit-soft:#331817; --info-soft:#1b2433;
  --heat:#d95926; --heat-soft:#32201a;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tn{font-variant-numeric:tabular-nums}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);color:var(--side-text);display:flex;flex-direction:column;padding:18px 14px;gap:18px;overflow:auto}
.brand{display:flex;gap:11px;align-items:center;padding:4px 6px}
.brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#3987e5,#184f95);display:grid;place-items:center;color:#fff;flex:none}
.brand b{display:block;font-size:14.5px;letter-spacing:-.01em}
.brand small{display:block;color:var(--side-muted);font-size:11.5px}
.navlbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--side-muted);padding:0 10px;margin-bottom:-10px}
nav#nav{display:flex;flex-direction:column;gap:3px}
nav#nav button{display:flex;align-items:center;gap:11px;border:0;background:transparent;color:var(--side-muted);font:inherit;font-weight:500;padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left;transition:background .15s,color .15s;position:relative}
nav#nav button:hover{background:var(--side-2);color:var(--side-text)}
nav#nav button.on{background:var(--side-2);color:#fff}
nav#nav button.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:#3987e5}
nav#nav button.on svg{color:#6da7ec}
.sidecard{background:var(--side-2);border:1px solid var(--side-border);border-radius:14px;padding:14px}
.sidecard .k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--side-muted)}
.sidecard .m{font-weight:700;font-size:16px;margin:4px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.sidecard .r{display:flex;justify-content:space-between;font-size:12.5px;color:var(--side-muted);padding:3px 0}
.sidecard .r b{color:var(--side-text);font-variant-numeric:tabular-nums}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.langs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--side-2);border:1px solid var(--side-border);border-radius:11px;padding:4px}
.langs button{display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:transparent;color:var(--side-muted);font:inherit;font-size:12px;font-weight:600;padding:7px 4px;border-radius:8px;cursor:pointer}
.langs button.on{background:var(--side);color:#fff;box-shadow:0 0 0 1px var(--side-border)}
.flag{width:20px;height:14px;border-radius:3px;overflow:hidden;display:block;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
.themebtn{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--side-border);background:var(--side-2);color:var(--side-muted);font:inherit;font-size:12.5px;padding:8px 12px;border-radius:11px;cursor:pointer}
.themebtn:hover{color:var(--side-text)}

.main{min-width:0;padding:26px 28px 40px}
.view{display:none}.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.pagehead h1{margin:0;font-size:24px;letter-spacing:-.025em;font-weight:800}
.pagehead p{margin:4px 0 0;color:var(--text-2)}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow)}
.chd{display:flex;align-items:center;gap:10px;padding:16px 18px 6px}
.chd h3{margin:0;font-size:14px;font-weight:650;letter-spacing:-.005em}
.chd .sp{margin-left:auto}
.cbd{padding:10px 18px 18px}
.ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.ico.heat{background:var(--heat-soft);color:var(--heat)}
.ico.good{background:var(--good-soft);color:var(--good)}
.ico.warn{background:var(--warn-soft);color:var(--warn)}
.ico.gray{background:var(--surface-2);color:var(--text-2)}

/* ---------- calc layout ---------- */
.calc{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;align-items:start}
@media (min-width:1001px){
  .inputs{position:sticky;top:14px;max-height:calc(100vh - 28px);overflow-y:auto;overscroll-behavior:contain;padding:0 6px 4px 0;margin-right:-6px;scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}
  .inputs::-webkit-scrollbar{width:6px}.inputs::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px}
}
@media (max-width:1000px){.calc{grid-template-columns:minmax(0,1fr)}}
.inputs>*{margin-bottom:14px}
details.acc>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;user-select:none}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary h3{margin:0;font-size:14px;font-weight:650}
details.acc>summary .chev{margin-left:auto;color:var(--muted);transition:transform .2s}
details.acc[open]>summary .chev{transform:rotate(180deg)}
details.acc .grid2{padding:2px 16px 16px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12px;color:var(--text-2);font-weight:500}
.field small{font-size:11px;color:var(--muted)}
.inp{display:flex;align-items:center;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);overflow:hidden;transition:border-color .15s,box-shadow .15s,background .15s}
.inp:hover{border-color:var(--border-strong)}
.inp:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--surface)}
.inp input{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font:inherit;font-weight:500;padding:8px 10px;outline:none;font-variant-numeric:tabular-nums}
.inp em{font-style:normal;font-size:11.5px;color:var(--muted);padding-right:10px;white-space:nowrap}
select{width:100%;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);color:var(--text);font:inherit;padding:9px 10px}
.ownpick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}
.ownpick button{border:1px solid var(--border);background:var(--surface-2);color:var(--text);font:inherit;border-radius:11px;padding:9px 8px;cursor:pointer;text-align:left;transition:all .15s}
.ownpick button b{display:block;font-size:13px}
.ownpick button span{font-size:11.5px;color:var(--muted)}
.ownpick button:hover{border-color:var(--border-strong)}
.ownpick button.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
.freq{display:flex;align-items:center;gap:12px}
.freq input[type=range]{flex:1;accent-color:var(--accent)}
.freq b{min-width:58px;text-align:center;font-variant-numeric:tabular-nums;background:var(--accent-soft);color:var(--text);border-radius:8px;padding:4px 6px;font-size:13px}
.spec{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.spec div{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.spec span{display:block;font-size:11px;color:var(--muted)}
.spec b{font-size:13px;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--text-2);white-space:nowrap}
.badge.own{background:var(--accent-soft);color:var(--text)}
.badge.est{background:var(--warn-soft);color:var(--text)}
.chip{border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);font:inherit;font-size:12px;padding:6px 12px;border-radius:999px;cursor:pointer}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--text)}
.ghost{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1px dashed var(--border-strong);background:transparent;color:var(--text-2);font:inherit;font-size:12.5px;padding:10px;border-radius:12px;cursor:pointer}
.ghost:hover{color:var(--text);border-color:var(--accent)}

/* ---------- results ---------- */
.results{display:flex;flex-direction:column;gap:16px;min-width:0}
.hero{position:relative;overflow:hidden;padding:22px 24px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 14%,var(--surface)) 0%,var(--surface) 60%)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 18%,transparent),transparent 70%);pointer-events:none}
.hero .k{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.06em}
.hero .big{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;margin-top:8px}
.hero .big div{font-size:44px;font-weight:800;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.hero .big u{text-decoration:none;font-size:15px;font-weight:600;color:var(--muted);margin-left:5px;letter-spacing:0}
.hero .big i{font-style:normal;color:var(--border-strong);font-size:30px;font-weight:300}
.hero .sub{color:var(--text-2);margin-top:10px;font-size:13px}
.hero .mini{display:grid;grid-template-columns:repeat(3,minmax(0,170px));gap:10px;position:relative;z-index:1}
.hero .mini div{background:color-mix(in srgb,var(--surface) 75%,transparent);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.hero .mini span{display:block;font-size:11px;color:var(--muted)}
.hero .mini b{font-size:17px;font-variant-numeric:tabular-nums}
.hero .mini b small{font-size:11px;color:var(--muted);font-weight:500;margin-left:2px}
@media (max-width:760px){.hero .mini{grid-template-columns:repeat(3,minmax(0,1fr))}.hero .big div{font-size:36px}}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--crit-soft);color:var(--crit)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:1440px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.kpis{grid-template-columns:minmax(0,1fr)}}
.kpi{padding:16px 16px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kpi .top{display:flex;align-items:center;gap:10px}
.kpi .l{font-size:12.5px;color:var(--text-2);font-weight:550}
.kpi .v{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .v u{text-decoration:none;font-size:13px;font-weight:600;color:var(--muted);margin-left:4px;letter-spacing:0}
.kpi .s{font-size:12px;color:var(--muted)}
.bar2{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;position:relative}
.bar2 i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.gauge{display:flex;align-items:flex-end;gap:12px}
.gauge svg{width:78px;height:46px;flex:none}
.gauge .v{font-size:26px}
.kpi .l{overflow:hidden;text-overflow:ellipsis}

/* process flow */
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;padding:18px 10px 16px}
.fstep{position:relative;padding:0 12px;text-align:center}
.fstep:not(:last-child)::after{content:"";position:absolute;top:24px;left:calc(50% + 32px);right:calc(-50% + 32px);height:2px;background:repeating-linear-gradient(90deg,var(--border-strong) 0 6px,transparent 6px 11px)}
.fstep:not(:last-child)::before{content:"";position:absolute;top:19px;right:calc(-50% + 26px);border:6px solid transparent;border-left:8px solid var(--border-strong);z-index:1}
.fstep .bub{width:50px;height:50px;border-radius:15px;margin:0 auto 10px;display:grid;place-items:center;position:relative;z-index:1}
.fstep .bub svg{width:22px;height:22px}
.fstep .nm{font-size:12px;font-weight:650;color:var(--text-2)}
.fstep .tt{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:2px 0 6px;font-variant-numeric:tabular-nums}
.fstep .tt u{text-decoration:none;font-size:12px;color:var(--muted);font-weight:600;margin-left:2px}
.fstep .rw{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:7px;padding:4px 8px;margin-top:4px}
.fstep .rw b{color:var(--text);font-variant-numeric:tabular-nums}
@media (max-width:760px){.flow{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:18px}.fstep::after,.fstep::before{display:none}}

.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:11px;padding:11px 14px;border-radius:12px;font-size:13px;border:1px solid transparent;align-items:flex-start}
.alert .ic{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex:none;color:#fff}
.alert .ic svg{width:14px;height:14px;stroke-width:2.6}
.alert.crit{background:var(--crit-soft);border-color:color-mix(in srgb,var(--crit) 28%,transparent)}.alert.crit .ic{background:var(--crit)}
.alert.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 28%,transparent)}.alert.warn .ic{background:var(--warn)}
.alert.info{background:var(--info-soft);border-color:color-mix(in srgb,var(--accent) 22%,transparent)}.alert.info .ic{background:var(--accent)}
.alert.good{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 28%,transparent)}.alert.good .ic{background:var(--good)}

.chartwrap{position:relative}
#chart{width:100%;height:380px;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-2)}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border-strong);border-radius:11px;padding:9px 11px;font-size:12px;box-shadow:0 8px 28px rgba(0,0,0,.14);min-width:180px;display:none;z-index:5}
.tip .r{display:flex;justify-content:space-between;gap:12px;padding:1px 0}
.tip .r b{font-variant-numeric:tabular-nums}
.tip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:1000px){.two{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;gap:2px;height:30px;border-radius:8px;overflow:hidden;margin:6px 0 16px}
.stack i{display:block;height:100%;min-width:2px}
.stack i:first-child{border-radius:6px 0 0 6px}.stack i:last-child{border-radius:0 6px 6px 0}
.dplist{display:flex;flex-direction:column;gap:2px}
.dplist .r{display:grid;grid-template-columns:12px minmax(0,1fr) auto 48px;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--border);font-size:13px}
.dplist .r:last-child{border:0}
.dplist .r .dot{width:10px;height:10px;border-radius:3px}
.dplist .r b{font-variant-numeric:tabular-nums;text-align:right}
.dplist .r em{font-style:normal;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;font-size:12px}
.dplist .tot{font-weight:700;background:var(--surface-2);border-radius:8px;border:0;margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{background:var(--surface-2);border-radius:11px;padding:10px 12px;min-width:0}
.tile span{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile b{font-size:15px;font-variant-numeric:tabular-nums}
.tile b small{font-size:11.5px;color:var(--muted);font-weight:500;margin-left:3px}
.own3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.own3{grid-template-columns:minmax(0,1fr)}}
.own3 .card{padding:16px;cursor:pointer;transition:border-color .15s,transform .15s}
.own3 .card:hover{border-color:var(--accent);transform:translateY(-2px)}
.own3 .card.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.own3 .mn{font-weight:750;font-size:16px}
.own3 .g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.own3 .g div{background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:11.5px;color:var(--muted)}
.own3 .g b{display:block;color:var(--text);font-size:16px;font-variant-numeric:tabular-nums}
.sectitle{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;margin:6px 0 -4px}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11.5px;font-weight:600;color:var(--text-2);text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface)}
td{padding:9px 12px;border-bottom:1px solid var(--border)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
tr.sel td{background:var(--accent-soft)!important}
.tscroll{overflow:auto;max-height:70vh;border-radius:0 0 16px 16px}
.tscroll thead th{position:sticky;top:0;z-index:1}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--text)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--border)}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);padding:0 10px;color:var(--muted)}
.search input{border:0;background:transparent;color:var(--text);font:inherit;padding:8px 0;outline:none;min-width:160px}
.muted{color:var(--muted)}
.labels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:26px}
@media (max-width:1100px){.labels{grid-template-columns:minmax(0,1fr)}}
.labels td,.labels th{padding:6px 8px}
.plate{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
details.card>summary{cursor:pointer;font-weight:650;padding:14px 16px;list-style:none;display:flex;align-items:center;gap:10px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary .chev{margin-left:auto;color:var(--muted);transition:transform .2s}
details.card[open]>summary .chev{transform:rotate(180deg)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}
@media (max-width:900px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{padding:16px;display:flex;gap:12px;align-items:center}
.stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}

/* ---------- method ---------- */
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:1000px){.mgrid{grid-template-columns:minmax(0,1fr)}}
.mcard{padding:20px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.mcard .no{position:absolute;right:16px;top:10px;font-size:46px;font-weight:800;color:var(--surface-3);letter-spacing:-.04em;line-height:1}
.mcard h3{margin:0;font-size:15.5px;display:flex;align-items:center;gap:10px}
.mcard p{margin:0;color:var(--text-2)}
.fx{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12.5px;background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:8px;padding:9px 12px;overflow-x:auto;white-space:nowrap;color:var(--text)}
.diagram{padding:20px 22px;margin-bottom:16px}
.diagram svg{width:100%;height:auto;display:block}
.limits{padding:20px;margin-top:16px}
.limits ul{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:900px){.limits ul{grid-template-columns:minmax(0,1fr)}}
.limits li{display:flex;gap:10px;background:var(--warn-soft);border-radius:11px;padding:11px 13px;color:var(--text);font-size:13px}
.limits li svg{color:var(--warn);margin-top:1px}


/* ---------- photos ---------- */
.stage{position:relative;border-radius:14px;background:radial-gradient(ellipse at 50% 42%,#ffffff 0%,#f1f2f4 62%,#e2e5e9 100%);display:grid;place-items:center;overflow:hidden;cursor:zoom-in;border:1px solid var(--border)}
.stage img{position:absolute;left:14px;top:14px;width:calc(100% - 28px);height:calc(100% - 28px);object-fit:contain;mix-blend-mode:multiply;transition:transform .35s ease}
.stage:hover img{transform:scale(1.04)}
.stage .cap{position:absolute;left:10px;bottom:8px;font-size:11px;font-weight:500;color:#55554f;background:rgba(255,255,255,.78);padding:2px 9px;border-radius:99px}
.stage .tag{position:absolute;right:10px;top:10px;font-size:11px;font-weight:700;color:#184f95;background:rgba(227,238,251,.92);padding:3px 9px;border-radius:99px}
.stage .zoom{position:absolute;right:10px;bottom:8px;width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.85);display:grid;place-items:center;color:#55554f}
.stage .zoom svg{width:14px;height:14px}
.stage.np{background:#1d1d1b}
.stage.np img{left:0;top:0;width:100%;height:100%;object-fit:cover;mix-blend-mode:normal}
#stageBox .stage{height:200px;margin-bottom:8px}
.thumbs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.thumbs button{width:58px;height:44px;border-radius:10px;border:1px solid var(--border);background:#f1f2f4;padding:3px;cursor:pointer;overflow:hidden;transition:border-color .15s}
.thumbs button img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;display:block}
.thumbs button.np img{object-fit:cover;mix-blend-mode:normal;border-radius:7px}
.thumbs button.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.thumbs button:hover{border-color:var(--border-strong)}
.tthumb{display:inline-grid;place-items:center;width:40px;height:30px;border-radius:7px;background:#f1f2f4;vertical-align:middle;margin-right:10px;overflow:hidden;border:1px solid var(--border)}
.tthumb img{max-width:92%;max-height:92%;mix-blend-mode:multiply}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:18px}
@media (max-width:1000px){.gallery{grid-template-columns:minmax(0,1fr)}}
.gcard{overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s}
.gcard:hover{transform:translateY(-3px);border-color:var(--accent)}
.gcard .stage{height:190px;border:0;border-radius:0;border-bottom:1px solid var(--border);cursor:pointer}
.gcard .gb{padding:14px 16px 16px}
.gcard h3{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gcard .rng{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.gcard .rng div{background:var(--surface-2);border-radius:9px;padding:7px 9px;font-size:11px;color:var(--muted)}
.gcard .rng b{display:block;color:var(--text);font-size:12.5px;font-variant-numeric:tabular-nums}
.lstage{height:200px;border:0;border-radius:0;border-bottom:1px solid var(--border)}
.npin{position:absolute;right:10px;bottom:10px;width:70px;height:50px;border-radius:9px;border:2px solid #fff;padding:0;overflow:hidden;cursor:zoom-in;box-shadow:0 3px 10px rgba(0,0,0,.25);background:#222}
.npin:hover{transform:scale(1.06)}
.stage .npin img{position:static;width:100%;height:100%;object-fit:cover;mix-blend-mode:normal;transform:none}
.npimg{display:block;width:100%;height:170px;object-fit:cover;object-position:center;cursor:zoom-in;border-bottom:1px solid var(--border)}
.labels .card{overflow:hidden}
.own3 .hd3{display:flex;align-items:center;gap:12px}
.own3 .hd3 .tthumb{width:52px;height:40px;margin:0}
.lb{position:fixed;inset:0;z-index:200;background:rgba(8,10,14,.84);backdrop-filter:blur(8px);display:none;place-items:center;padding:24px}
.lb.on{display:grid;animation:fade .2s ease}
.lb .fr{position:relative;max-width:min(92vw,980px);display:flex;flex-direction:column;align-items:center;gap:10px}
.lb .pic{border-radius:18px;overflow:hidden;display:grid;place-items:center}
.lb .pic.prod{background:radial-gradient(ellipse at 50% 42%,#fff 0%,#f1f2f4 62%,#e2e5e9 100%);padding:28px}
.lb img{max-width:min(88vw,920px);max-height:76vh;display:block}
.lb .pic.prod img{mix-blend-mode:multiply}
.lb .cp{color:#e9eef6;font-size:13px}
.lb .x{position:absolute;top:-14px;right:-14px;width:36px;height:36px;border-radius:50%;border:0;background:#fff;color:#111;cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 16px rgba(0,0,0,.3)}


/* ---------- about ---------- */
.abhero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:26px;padding:30px;align-items:center;overflow:hidden;
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 16%,var(--surface)) 0%,var(--surface) 62%)}
.abhero .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.07em;color:var(--accent)}
.abhero h2{font-size:32px;letter-spacing:-.035em;margin:8px 0 6px;font-weight:800;line-height:1.1}
.abhero .lead{font-size:15px;color:var(--text-2);margin:0 0 4px;font-weight:550}
.abhero p.body{color:var(--text-2);font-size:14px;line-height:1.65;margin:12px 0 18px}
.abhero .stage{height:270px}
.abchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.abchips span{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600}
.abchips svg{width:15px;height:15px;color:var(--accent)}
.cta{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:0;font:inherit;font-weight:650;padding:11px 18px;border-radius:11px;cursor:pointer;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent)}
.cta:hover{filter:brightness(1.07)}
.secH{font-size:17px;font-weight:750;margin:30px 0 14px;display:flex;gap:10px;align-items:center;letter-spacing:-.01em}
.qgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:1100px){.qgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.qgrid{grid-template-columns:minmax(0,1fr)}}
.qcard{padding:18px;display:flex;gap:14px;align-items:flex-start}
.qcard .ico{width:40px;height:40px;border-radius:12px}
.qcard h4{margin:2px 0 4px;font-size:14.5px}
.qcard p{margin:0;color:var(--text-2);font-size:13px;line-height:1.5}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:1100px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.steps{grid-template-columns:minmax(0,1fr)}}
.step{padding:18px;position:relative;overflow:hidden}
.step .n{width:34px;height:34px;border-radius:11px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;margin-bottom:12px}
.step h4{margin:0 0 4px;font-size:14.5px}
.step p{margin:0;color:var(--text-2);font-size:13px;line-height:1.5}
.step .bgi{position:absolute;right:-8px;bottom:-10px;color:var(--surface-3);opacity:.7}
.step>*:not(.bgi){position:relative}
.step .bgi svg{width:76px;height:76px;stroke-width:1.5}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:600px){.pgrid{grid-template-columns:minmax(0,1fr)}}
.pcard{padding:16px;cursor:pointer;transition:transform .15s,border-color .15s}
.pcard:hover{transform:translateY(-2px);border-color:var(--accent)}
.pcard h4{margin:10px 0 4px;font-size:14px;display:flex;align-items:center;gap:6px}
.pcard p{margin:0;color:var(--text-2);font-size:12.5px;line-height:1.5}
.srow{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px}
.srow:last-child{border:0}
.prin{margin-top:12px;padding:16px 18px;background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.prin h4{margin:0 0 6px;display:flex;align-items:center;gap:8px;font-size:14.5px}
.prin h4 svg{color:var(--good)}
.prin p{margin:0;font-size:13px;line-height:1.55;color:var(--text)}
@media (max-width:900px){.abhero{grid-template-columns:minmax(0,1fr);padding:22px}.abhero h2{font-size:25px}.abhero .stage{height:200px}}


/* ---------- input quick-nav ---------- */
.inav{position:sticky;top:0;z-index:6;display:flex;gap:4px;padding:6px;margin-bottom:12px;border-radius:13px;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(10px);border:1px solid var(--border);box-shadow:var(--shadow);overflow-x:auto;scrollbar-width:none}
.inav::-webkit-scrollbar{display:none}
.inav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;color:var(--text-2);font:inherit;font-size:10.5px;font-weight:600;padding:6px 4px;border-radius:9px;cursor:pointer;white-space:nowrap;min-width:52px}
.inav button svg{width:17px;height:17px}
.inav button:hover{background:var(--surface-2);color:var(--text)}
.inav button.on{background:var(--accent-soft);color:var(--accent)}
.inputs .card,.inputs details{scroll-margin-top:72px}
@media (max-width:1000px){.inav{top:var(--topbar,0px)}}
/* ---------- floating result bar ---------- */
.opbar{position:fixed;z-index:40;top:12px;display:flex;align-items:stretch;gap:0;padding:8px 6px 8px 12px;border-radius:15px;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(14px);border:1px solid var(--border);box-shadow:0 12px 32px rgba(0,0,0,.14);opacity:0;transform:translateY(-12px);pointer-events:none;transition:opacity .2s,transform .2s;overflow-x:auto;scrollbar-width:none}
.opbar::-webkit-scrollbar{display:none}
.opbar.show{opacity:1;transform:none;pointer-events:auto}
.opbar .mdl{display:flex;align-items:center;gap:8px;padding-right:12px;font-weight:750;font-size:14px;white-space:nowrap;cursor:pointer}
.opbar .mdl .tthumb{margin:0;width:36px;height:28px}
.opbar .it{display:flex;flex-direction:column;justify-content:center;padding:0 14px;border-left:1px solid var(--border);white-space:nowrap}
.opbar .it span{font-size:10.5px;color:var(--muted);font-weight:500}
.opbar .it b{font-size:16px;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.opbar .it b small{font-size:11px;color:var(--muted);font-weight:500;margin-left:2px}
.opbar .it.warn b{color:var(--warn)}.opbar .it.crit b{color:var(--crit)}
.opbar .msg{display:flex;align-items:center;padding:0 14px;border-left:1px solid var(--border);font-size:12.5px;color:var(--text-2);white-space:nowrap}
.opbar .top{display:grid;place-items:center;margin-left:auto;padding:0 6px 0 12px}
.opbar .top button{width:32px;height:32px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);cursor:pointer;display:grid;place-items:center}
.opbar .top button svg{width:16px;height:16px}
@media (max-width:1000px){.opbar{top:auto;bottom:10px;left:10px!important;right:10px;width:auto!important;transform:translateY(12px);padding:8px 6px 8px 10px}.opbar .it{padding:0 10px}.opbar .it b{font-size:14px}.opbar .mdl .tthumb{display:none}}


/* ---------- system schematic ---------- */
.schwrap{overflow-x:auto;padding:4px 14px 0}
.schwrap svg{display:block;width:100%;min-width:680px;height:auto}
.sch text{font-family:Inter,system-ui,sans-serif}
.sch .cap{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;fill:var(--muted)}
.sch .in{font-size:12px;font-weight:650;fill:var(--text)}
.sch .r1{font-size:12px;font-weight:600;fill:var(--text-2)}
.sch .r2{font-size:11px;fill:var(--muted)}
.sch .big{font-size:20px;font-weight:800;letter-spacing:-.02em}
.sch .hot{cursor:pointer;transition:opacity .15s}
.sch .hot:hover{opacity:.82}
.sch .flowline{stroke:#fff;stroke-opacity:.6;stroke-dasharray:3 13;stroke-linecap:round;animation:schflow 1s linear infinite}
@keyframes schflow{to{stroke-dashoffset:-32}}
@media (prefers-reduced-motion:reduce){.sch .flowline{animation:none}}
.schleg{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 18px 16px;font-size:11.5px;color:var(--muted)}
.schleg .bar{width:140px;height:8px;border-radius:99px;background:linear-gradient(90deg,rgb(42,120,214),rgb(237,161,0),rgb(227,73,72))}
.schleg .hint{margin-left:auto;display:flex;align-items:center;gap:6px}
.schleg .hint svg{width:14px;height:14px}

/* ---------- mobile ---------- */
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;z-index:30;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 16px;gap:10px}
  .brand small,.navlbl,.sidecard{display:none}
  .brand .logo{width:32px;height:32px}
  .sidefoot{margin:0 0 0 auto;flex-direction:row;align-items:center}
  .themebtn span{display:none}
  .langs button span{display:none}
  nav#nav{order:5;flex-direction:row;width:100%;overflow-x:auto;gap:4px}
  nav#nav button{padding:8px 11px;white-space:nowrap;font-size:13px}
  nav#nav button.on::before{display:none}
  .main{padding:18px 16px 32px}
  .pagehead h1{font-size:20px}
  #chart{height:300px}
}
@media (max-width:420px){.grid2{grid-template-columns:minmax(0,1fr)}.inputs{grid-template-columns:minmax(0,1fr)!important}.brand b{font-size:13px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><svg class="i" viewBox="0 0 24 24"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></svg></div>
      <div><b>Air Knife Calc</b><small data-t="brandSub"></small></div>
    </div>
    <div class="navlbl" data-t="menu"></div>
    <nav id="nav"></nav>
    <div class="sidecard" id="sideOp"></div>
    <div class="sidefoot">
      <div class="langs" id="langs"></div>
      <button class="themebtn" id="themeBtn"><span data-t="theme"></span><svg class="i" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </div>
  </aside>

  <main class="main">
    <!-- ================= CALC ================= -->
    <section class="view on" id="v-calc">
      <div class="pagehead"><div><h1 data-t="calcT"></h1><p data-t="calcS"></p></div></div>
      <div class="calc">
        <div class="inputs" id="inputs">
          <div class="inav" id="inav"></div>
          <div class="card" id="sec-gBlower">
            <div class="chd"><span class="ico"><svg class="i" viewBox="0 0 24 24" data-icon="fan"></svg></span><h3 data-t="gBlower"></h3><span class="sp" id="srcBadge"></span></div>
            <div class="cbd">
              <div id="stageBox"></div>
              <div class="ownpick" id="ownPick"></div>
              <select id="model"></select>
              <div class="field" style="margin-top:14px">
                <span data-t="freqL"></span>
                <div class="freq"><input type="range" id="freq" min="30" max="60" step="1"><b id="freqV"></b></div>
                <small data-t="freqH"></small>
              </div>
              <div class="spec" id="spec"></div>
            </div>
          </div>
          <div id="fieldCards" style="display:contents"></div>
          <button class="ghost" id="resetBtn"><svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span data-t="reset"></span></button>
        </div>

        <div class="results">
          <div class="card hero" id="hero"></div>
          <div class="kpis" id="kpis"></div>
          <div class="card">
            <div class="chd"><span class="ico gray"><svg class="i" viewBox="0 0 24 24" data-icon="route"></svg></span><h3 data-t="flowT"></h3></div>
            <div class="schwrap" id="flow"></div><div class="schleg" id="schLeg"></div>
          </div>
          <div class="alerts" id="alerts"></div>
          <div class="card">
            <div class="chd" style="flex-wrap:wrap"><span class="ico"><svg class="i" viewBox="0 0 24 24" data-icon="chart"></svg></span><h3 data-t="chartT"></h3>
              <div class="legend sp"><span><i style="background:var(--s1)"></i><span data-t="lgB"></span></span><span><i style="background:var(--s2)"></i><span data-t="lgS"></span></span><span><i style="background:none;border-top:2px dashed var(--muted);height:0"></i><span data-t="lgM"></span></span></div>
            </div>
            <div class="cbd chartwrap"><svg id="chart" role="img"></svg><div class="tip" id="tip"></div></div>
          </div>
          <div class="two">
            <div class="card"><div class="chd"><span class="ico"><svg class="i" viewBox="0 0 24 24" data-icon="layers"></svg></span><h3 data-t="dpT"></h3><span class="sp badge tn" id="dpTot"></span></div><div class="cbd" id="dpBox"></div></div>
            <div class="card"><div class="chd"><span class="ico"><svg class="i" viewBox="0 0 24 24" data-icon="grid"></svg></span><h3 data-t="detT"></h3></div><div class="cbd tiles" id="tiles"></div></div>
          </div>
          <div class="sectitle"><span class="ico"><svg class="i" viewBox="0 0 24 24" data-icon="fan"></svg></span><span data-t="own3T"></span></div>
          <div class="own3" id="own3"></div>
        </div>
      </div>
    </section>

    <!-- ================= SCAN ================= -->
    <section class="view" id="v-scan">
      <div class="pagehead"><div><h1 data-t="scanT"></h1><p data-t="scanS"></p></div></div>
      <div class="stats" id="scanStats"></div>
      <div class="card">
        <div class="toolbar">

const MODELS = [];

}
const BYID = Object.fromEntries(MODELS.map(m=>[m.id,m]));

/* ======================= FİZİK ======================= */
const R=287.05, G=1.4, CPI=G*R/(G-1), RHO_N=101325/(R*273.15);
const PRC = Math.pow(2/(G+1), G/(G-1));
const rho=(p,T)=>p/(R*T);
const cp =T=>Math.max(1003, 1005+0.1375*(T-300));
const mu =T=>1.716e-5*Math.pow(T/273.15,1.5)*(273.15+110.4)/(T+110.4);

function pipeDp(md,Dmm,L,K,p,T,epsmm){
  if(!(Dmm>0)||!(md>0)) return {dp:0,v:0,Re:0};
  const D=Dmm/1000, A=Math.PI*D*D/4, r=rho(p,T), v=md/(r*A), Re=r*v*D/mu(T);
  const f = Re<2300 ? 64/Math.max(Re,1) : 0.25/Math.pow(Math.log10(Math.max(epsmm,0)/1000/(3.7*D)+5.74/Math.pow(Re,0.9)),2);
  return {dp:(f*Math.max(L,0)/D+Math.max(K,0))*r*v*v/2, v, Re};
}
function oriM(p0,T0,pa,A,Cd){
  const pr=Math.max(pa/p0,PRC); if(pr>=1) return 0;
  return Cd*A*p0*Math.sqrt(2*G/((G-1)*R*T0)*(Math.pow(pr,2/G)-Math.pow(pr,(G+1)/G)));
}
function oriP0(md,T0,pa,A,Cd){
  let lo=pa, hi=pa*1.05, n=0;
  while(oriM(hi,T0,pa,A,Cd)<md && n<80){hi*=1.3;n++;}
  for(let i=0;i<60;i++){const m=(lo+hi)/2; if(oriM(m,T0,pa,A,Cd)<md) lo=m; else hi=m;}
  return hi;
}

/* --- blower eğrisi: yalnızca katalog noktaları --- */
function baseCurve(m){
  const ax = m.ser==='TD'?AX2:AX1;
  const fromQ = id=>CURVE_Q[id].map((q,i)=>[ax[i],q]);
  const fam = Object.keys(CURVE_Q).filter(id=>BYID[id]&&BYID[id].ser===m.ser&&BYID[id].frame===m.frame);
  if(!fam.length) return null;
  const longest = fam.reduce((a,b)=>CURVE_Q[b].length>CURVE_Q[a].length?b:a);
  let pts, src;
  if (CURVE_Q[m.id]) {
    pts=fromQ(m.id); src={k:'model',id:m.id};
    // aynı gövde (aynı çark, aynı Q0) için katalogdaki daha uzun eğrinin noktaları
    const last=pts[pts.length-1][0];
    if(longest!==m.id && CURVE_Q[longest][0]===CURVE_Q[m.id][0]) fromQ(longest).forEach(([p,q])=>{ if(p>last) pts.push([p,q]); });
  } else { pts=fromQ(longest); src={k:'frame',id:longest}; }
  return {pts,src};
}
function makeBlower(m,f){
  const lab=LABELS[m.id], fmax=lab?60:50;
  f=Math.min(f,fmax);
  const r=f/50;
  const pmax = f<=50 ? (lab?lab.r50.p:m.pmax) : lab.r50.p+(lab.r60.p-lab.r50.p)*(f-50)/10;
  const kw = lab?lab.r50.kw:m.kw;
  const b=baseCurve(m);
  if(!b) return {m,f,r,pmax,kw,lab,fmax,nocurve:true};
  const pts=b.pts.map(([p,q])=>[p*r*r,q*r]);
  const E=pts[pts.length-1];
  return {m,f,r,pts,pmax,kw,lab,fmax,q0:pts[0][1],qEnd:E[1],pEnd:E[0],src:b.src};
}
function pAt(B,Q){ // mbar; katalog aralığı dışında NaN
  const P=B.pts;
  if(Q>P[0][1]) return -(Q-P[0][1])*(P[1][0]-P[0][0])/(P[0][1]-P[1][1]); // yalnızca kök arama için
  for(let i=0;i<P.length-1;i++){const [p1,q1]=P[i],[p2,q2]=P[i+1]; if(Q<=q1&&Q>=q2) return q1===q2?p1:p1+(p2-p1)*(q1-Q)/(q1-q2);}
  return NaN;
}
function qAt(B,p){
  const P=B.pts; if(p<=0) return P[0][1];
  for(let i=0;i<P.length-1;i++){const [p1,q1]=P[i],[p2,q2]=P[i+1]; if(p>=p1&&p<=p2) return q1+(q2-q1)*(p-p1)/(p2-p1);}
  return NaN;
}

/* --- sistem --- */
function sysAt(B,S,Qin){
  const pa=S.Pa*100, Ta=S.Ta+273.15, ra=rho(pa,Ta), md=Math.max(Qin,1e-6)/3600*ra;
  const A=Math.max(S.nK,1)*S.kL/1000*S.kG/1000;
  let dp=0, o=null;
  for(let k=0;k<8;k++){
    const Tb = Ta*Math.pow((pa+Math.max(dp,0))/pa,(G-1)/G); // izentropik sıkıştırma
    const Tt=S.hT+273.15, cph=cp((Tb+Math.max(Tt,Tb))/2), eta=Math.max(S.hEff,1)/100;
    const Preq = Tt>Tb ? md*cph*(Tt-Tb)/eta : 0;
    let Th, Puse;
    if (Preq<=S.hP*1000){Th=Math.max(Tt,Tb);Puse=Preq;} else {Puse=S.hP*1000;Th=Tb+Puse*eta/(md*cph);}
    const Tk=Math.max(Ta,Th-S.Tloss);
    const p0=oriP0(md,Tk,pa,A,S.kCd);
    const l2=pipeDp(md,S.D2,S.L2,S.K2,p0,(Th+Tk)/2,S.eps);
    const pH=p0+l2.dp;
    const mref=S.hQ/3600*ra;
    const dph = mref>0 ? S.hDp*100*Math.pow(md/mref,2)*(ra/rho(pH,(Tb+Th)/2)) : 0;
    const l1=pipeDp(md,S.D1,S.L1,S.K1,pH+dph,Tb,S.eps);
    const dpn=p0-pa+l2.dp+dph+l1.dp+S.dpx*100;
    o={md,Qin,Ta,Tb,Th,Tk,Tt,Preq,Puse,p0,pa,A,dpK:p0-pa,dp2:l2.dp,v2:l2.v,dph,dp1:l1.dp,v1:l1.v,dpx:S.dpx*100,dp:dpn};
    if(Math.abs(dpn-dp)<0.2){break;} dp=dpn;
  }
  return o;
}
function solve(B,S){
  if(B.nocurve) return null;
  const g=Q=>pAt(B,Q)*100-sysAt(B,S,Q).dp;
  if(g(B.qEnd)<=0) return {out:true,pEnd:B.pEnd};   // çalışma noktası katalog eğrisinin dışında
  let lo=B.qEnd, hi=B.q0;
  for(let i=0;i<55;i++){const m=(lo+hi)/2; if(g(m)>0) lo=m; else hi=m;}
  const o=sysAt(B,S,(lo+hi)/2);
  const pr=Math.max(o.pa/o.p0,PRC);
  o.vj = 0.97*Math.sqrt(2*CPI*o.Tk*(1-Math.pow(pr,(G-1)/G)));
  o.choked = o.pa/o.p0<PRC;
  o.Qn = o.md/RHO_N*3600;
  o.Qhot = o.md/rho(o.pa,o.Tk)*3600;
  o.F = o.md*o.vj;
  o.Fpm = o.F/(Math.max(S.nK,1)*S.kL/1000);
  const xb=S.kX/S.kG;
  o.vx = o.vj*Math.min(1,2.4/Math.sqrt(Math.max(xb,1e-9)));
  o.Tx = o.Ta+(o.Tk-o.Ta)*Math.min(1,2.0/Math.sqrt(Math.max(xb,1e-9)));
  o.pB = o.dp/100;
  o.util = o.pB/B.pmax;
  o.over = o.pB>B.pmax*1.001;
  o.mach = o.vj/Math.sqrt(G*R*o.Tk);

let chartGeo=null;
function drawChart(){
  const svg=$('#chart');if(!svg.clientWidth)return;

  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const xMax=B.q0*1.06,opP=okOP(OP)?OP.pB:0,yMax=niceMax(Math.max(B.pmax*1.25,opP*1.15,50));

  const grid=C('--grid'),mut=C('--muted'),t2=C('--text-2'),s1=C('--s1'),s2=C('--s2'),surf=C('--surface'),tx=C('--text');
  let h=`<defs><linearGradient id="gB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s1}" stop-opacity=".16"/><stop offset="1" stop-color="${s1}" stop-opacity="0"/></linearGradient></defs>`;
  ticks(yMax,6).forEach(v=>{h+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="${grid}"/><text x="${m.l-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="${mut}">${fmt(v,0)}</text>`;});
  ticks(xMax,W<500?4:6).forEach(v=>{h+=`<text x="${X(v)}" y="${H-m.b+18}" text-anchor="middle" font-size="11" fill="${mut}">${fmt(v,0)}</text>`;});
  h+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="${C('--border-strong')}"/>`;
  h+=`<text x="${(m.l+W-m.r)/2}" y="${H-6}" text-anchor="middle" font-size="11.5" fill="${t2}">${t('xAx')}</text>`;
  h+=`<text transform="translate(13,${(m.t+H-m.b)/2}) rotate(-90)" text-anchor="middle" font-size="11.5" fill="${t2}">${t('yAx')}</text>`;
  // blower eğrisi: yalnızca katalog noktaları (doğrusal), motor sınırı üstü kesikli
  const P=B.pts,qPm=qAt(B,B.pmax),sol=[],dash=[];
  P.forEach(([p,q])=>{ if(p<=B.pmax) sol.push([X(q),Y(p)]); });
  if(isFinite(qPm)){ sol.push([X(qPm),Y(B.pmax)]); dash.push([X(qPm),Y(B.pmax)]); P.forEach(([p,q])=>{ if(p>B.pmax) dash.push([X(q),Y(p)]); }); }
  const path=a=>a.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+','+pt[1].toFixed(1)).join('');
  h+=`<clipPath id="plot"><rect x="${m.l}" y="${m.t}" width="${W-m.l-m.r}" height="${H-m.t-m.b}"/></clipPath><g clip-path="url(#plot)">`;
  if(sol.length>1) h+=`<path d="${path(sol)}L${sol[sol.length-1][0].toFixed(1)},${Y(0)}L${sol[0][0].toFixed(1)},${Y(0)}Z" fill="url(#gB)"/>`;
  h+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(B.pmax)}" y2="${Y(B.pmax)}" stroke="${mut}" stroke-dasharray="5 4" stroke-width="1.5"/>`;
  if(dash.length>1) h+=`<path d="${path(dash)}" fill="none" stroke="${s1}" stroke-width="2" stroke-dasharray="3 4" opacity=".6"/>`;
  h+=`<path d="${path(sol)}" fill="none" stroke="${s1}" stroke-width="2.5" stroke-linejoin="round"/>`;
  P.forEach(([p,q])=>{ h+=`<circle cx="${X(q)}" cy="${Y(p)}" r="3.5" fill="${surf}" stroke="${s1}" stroke-width="2" opacity="${p>B.pmax?.6:1}"/>`; });
  h+=`</g><text x="${W-m.r-4}" y="${Y(B.pmax)-7}" text-anchor="end" font-size="11" fill="${t2}">${t('motorMax',{p:fmt(B.pmax,0)})}</text>`;
  const sys=[[X(0),Y(S.dpx)]];for(let i=1;i<=80;i++){const q=xMax*i/80,p=sysAt(B,S,q).dp/100;if(p>yMax*1.02)break;sys.push([X(q),Y(p)]);}
  h+=`<path d="${path(sys)}" fill="none" stroke="${s2}" stroke-width="2.5" stroke-linejoin="round"/>`;
  const lbP=sol[Math.max(0,Math.floor(sol.length*0.6))];if(lbP)h+=`<text x="${lbP[0]-10}" y="${lbP[1]+20}" text-anchor="end" font-size="11.5" font-weight="600" fill="${t2}">${B.m.id} @ ${S.freq} Hz</text>`;
  const ls=sys[sys.length-1];if(ls)h+=`<text x="${Math.min(ls[0]-14,W-m.r-4)}" y="${ls[1]+(ls[1]<m.t+20?18:4)}" text-anchor="end" font-size="11.5" font-weight="600" fill="${t2}">${t('sysL')}</text>`;
  if(okOP(OP)){const ox=X(OP.Qin),oy=Y(OP.pB),col=OP.over?C('--crit'):tx;
    h+=`<line x1="${ox}" x2="${ox}" y1="${oy}" y2="${Y(0)}" stroke="${tx}" stroke-dasharray="2 3" opacity=".45"/><line x1="${m.l}" x2="${ox}" y1="${oy}" y2="${oy}" stroke="${tx}" stroke-dasharray="2 3" opacity=".45"/>`;
    h+=`<circle cx="${ox}" cy="${oy}" r="13" fill="${col}" opacity=".12"/><circle cx="${ox}" cy="${oy}" r="7" fill="${col}" stroke="${surf}" stroke-width="2.5"/>`;
    const right=ox<W*0.6,lbl=`${fmt(OP.Qin,0)} m³/h · ${fmt(OP.pB,0)} mbar`,tw=lbl.length*6.6+16,bx=right?ox+14:ox-14-tw;
    h+=`<rect x="${bx}" y="${oy-34}" width="${tw}" height="22" rx="6" fill="${surf}" stroke="${C('--border-strong')}"/><text x="${bx+8}" y="${oy-19}" font-size="12" font-weight="700" fill="${tx}">${lbl}</text>`;}
  h+=`<line id="cx" y1="${m.t}" y2="${Y(0)}" stroke="${mut}" opacity="0"/><circle id="cb" r="5" fill="${s1}" stroke="${surf}" stroke-width="2" opacity="0"/><circle id="cs" r="5" fill="${s2}" stroke="${surf}" stroke-width="2" opacity="0"/>`;
  h+=`<rect x="${m.l}" y="${m.t}" width="${W-m.l-m.r}" height="${H-m.t-m.b}" fill="transparent"/>`;
  svg.innerHTML=h;chartGeo={X,Y,m,W,H,xMax};
}
function niceMax(v){const e=Math.pow(10,Math.floor(Math.log10(v)));for(const k of [1,1.5,2,2.5,3,4,5,6,8,10])if(k*e>=v)return k*e;return 10*e;}
function ticks(max,n){const raw=max/n,e=Math.pow(10,Math.floor(Math.log10(raw)));const st=[1,2,2.5,5,10].map(k=>k*e).find(s=>s>=raw);const a=[];for(let v=0;v<=max+1e-9;v+=st)a.push(v);return a;}
function chartHover(e){
  if(!chartGeo)return;
  const svg=$('#chart'),r=svg.getBoundingClientRect(),{X,Y,m,W,H,xMax}=chartGeo;
  const sx=(e.clientX-r.left)*W/r.width;
  if(sx<m.l||sx>W-m.r){hideTip();return;}
  const q=(sx-m.l)/(W-m.l-m.r)*xMax,pb=pAt(B,q),ps=sysAt(B,S,q).dp/100;
  const cx=$('#cx'),cb=$('#cb'),cs=$('#cs');
  cx.setAttribute('x1',sx);cx.setAttribute('x2',sx);cx.setAttribute('opacity',.6);

  const tip=$('#tip');
  tip.innerHTML=`<div class="r"><span>${t('tipQ')}</span><b>${fmt(q,0)} m³/h</b></div><div class="r"><span><i style="background:var(--s1)"></i>${t('lgB')}</span><b>${pb>=0&&isFinite(pb)?fmt(pb,0)+' mbar':'–'}</b></div><div class="r"><span><i style="background:var(--s2)"></i>${t('lgS')}</span><b>${fmt(ps,0)} mbar</b></div>${isFinite(pb)&&pb>B.pmax?`<div class="r" style="color:var(--crit)">${t('tipOver')}</div>`:''}`;

    <g transform="translate(59,14) scale(1.35)" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[icon]}</g>

  const arrow=(x1,x2,lbl,col)=>`<line x1="${x1}" y1="83" x2="${x2-8}" y2="83" stroke="${col}" stroke-width="3" stroke-linecap="round"/><path d="M${x2-10} 76 L${x2} 83 L${x2-10} 90" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="${(x1+x2)/2}" y="70" text-anchor="middle" font-size="12" fill="var(--muted)">${lbl}</text>`;
  $('#diagram').innerHTML=`<svg viewBox="0 0 960 170" role="img" aria-label="${t('mT')}">
    <text x="10" y="74" font-size="12" fill="var(--muted)">${t('dgAir')}</text>
    ${arrow(10,120,'',C('--s1'))}
    ${box(120,t('dgBlower'),'fan','var(--accent)','var(--accent-soft)')}
    ${arrow(270,420,t('dgCold'),C('--s1'))}
    ${box(420,t('dgHeater'),'flame','var(--heat)','var(--heat-soft)')}
    ${arrow(570,720,t('dgHot'),C('--s2'))}
    ${box(720,t('dgKnife'),'knife','var(--accent)','var(--accent-soft)')}
    <g stroke="${C('--s2')}" stroke-width="2.5" stroke-linecap="round" opacity=".85"><line x1="795" y1="132" x2="795" y2="160"/><line x1="770" y1="134" x2="760" y2="160"/><line x1="820" y1="134" x2="830" y2="160"/></g>
    <text x="880" y="152" font-size="12" fill="var(--muted)">${t('dgJet')}</text>
    <text x="195" y="150" text-anchor="middle" font-size="12" fill="var(--muted)">p ↑ · T ↑</text>
    <text x="495" y="150" text-anchor="middle" font-size="12" fill="var(--muted)">T ↑↑ · ρ ↓</text>
  </svg>`;
  const M=[['bolt','',['p_blower(Q) = Σ Δp_i(Q)'],'m7'],['fan','',['Q ∝ f/50','Δp ∝ (f/50)²'],'m1'],['therm','heat',['T₂ = T₁ · (p₂/p₁)^((γ−1)/γ)'],'m2'],
    ['flame','heat',['P = ṁ·c_p·ΔT / η','Δp = Δp_ref·(ṁ/ṁ_ref)²·ρ_ref/ρ'],'m3'],['hose','',['Δp = (f·L/D + ΣK) · ρv²/2'],'m4'],
    ['knife','',['ṁ = C_d·A·p₀·√( 2γ/((γ−1)RT₀) · (r^(2/γ) − r^((γ+1)/γ)) )','v = 0,97·√( 2c_p·T₀·(1 − r^((γ−1)/γ)) ),  r = p_atm/p₀'],'m5'],
    ['target','good',['v_x / v₀ ≈ 2,4 / √(x/b)','ΔT_x / ΔT₀ ≈ 2,0 / √(x/b)'],'m6'],['sliders','gray',['Q₂ = Q₁·(f₂/f₁)','Δp₂ = Δp₁·(f₂/f₁)²'],'m8']];
  $('#mgrid').innerHTML=M.map(([i,c,fx,k],n)=>`<div class="card mcard"><span class="no">${String(n+1).padStart(2,'0')}</span><h3><span class="ico ${c}">${ic(i)}</span>${t(k+'t')}</h3><p>${t(k+'x')}</p>${fx.map(f=>`<div class="fx">${LANG==='en'?f.replace(/(\d),(\d)/g,'$1.$2'):f}</div>`).join('')}</div>`).join('');
  $('#limits').innerHTML=['l1','l2','l3','l4'].map(k=>`<li>${ic('alert')}<span>${t(k)}</span></li>`).join('');
}


/* ======================= FOTOĞRAFLAR ======================= */
const ZOOM='<svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3M11 8v6M8 11h6"/></svg>';
function renderStage(m){
  const views=PHOTOS[m.ser].map(([k,v])=>({k,v,np:false}));
  if(NP[m.id]) views.push({k:NP[m.id],v:'vPlate',np:true});
  if(!photoSel||photoSel.model!==m.id||!views.some(x=>x.k===photoSel.k)) photoSel={model:m.id,k:views[0].k};
  const cur=views.find(x=>x.k===photoSel.k);
  const main=cur.np
    ? `<div class="stage np" data-zoom="${cur.k}" data-np="1" data-cap="${m.name} · ${t('vPlate')}"><img src="${IMG[cur.k]}" alt=""><span class="cap">${t('vPlate')}</span><span class="zoom">${ZOOM}</span></div>`
    : `<div class="stage" data-zoom="${cur.k}" data-cap="${t('ser'+m.ser)} · ${t(cur.v)}"><img src="${IMG[cur.k]}" alt="${m.name}"><span class="tag">${m.ser}</span><span class="cap">${t(cur.v)}</span><span class="zoom">${ZOOM}</span></div>`;
  $('#stageBox').innerHTML=main+(views.length>1?`<div class="thumbs">${views.map(x=>`<button class="${x.np?'np':''} ${x.k===cur.k?'on':''}" data-pk="${x.k}" title="${t(x.v)}"><img src="${IMG[x.k]}" alt=""></button>`).join('')}</div>`:'');
}
function renderGallery(){
  const rng=(a,d=0)=>a[0]===a[1]?fmt(a[0],d):fmt(a[0],d)+'–'+fmt(a[1],d);
  $('#gallery').innerHTML=['TS','MS','TD'].map(ser=>{const L=MODELS.filter(m=>m.ser===ser),mm=k=>[Math.min(...L.map(m=>m[k])),Math.max(...L.map(m=>m[k]))];
    return `<div class="card gcard" data-goto="${ser}"><div class="stage"><img src="${IMG[PHOTOS[ser][0][0]]}" alt="${ser}"><span class="tag">${ser}</span><span class="cap">${t(ser==='TD'?'stage2':'stage1')}</span></div>
    <div class="gb"><h3>${t('ser'+ser)} ${ser==='TS'?`<span class="badge own">${t('yourSer')}</span>`:''}</h3><span class="muted" style="font-size:12px">${t('nModels',{n:L.length})} · ${t('photoNote')}</span>
    <div class="rng"><div>${t('gPow')}<b>${rng(mm('kw'),2)} kW</b></div><div>${t('gFlow')}<b>${rng(mm('q'))} m³/h</b></div><div>${t('gPress')}<b>${rng(mm('pmax'))} mbar</b></div></div></div></div>`;}).join('');
}
function openLB(k,cap,np){
  const lb=$('#lb');
  lb.innerHTML=`<div class="fr"><div class="pic ${np?'':'prod'}"><img src="${IMG[k]}" alt=""></div><div class="cp">${cap||''}</div><button class="x" aria-label="${t('zoomT')}"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>`;
  lb.classList.add('on');
}
document.addEventListener('click',e=>{
  if(e.target.closest('#lb')){ if(e.target.closest('.x')||!e.target.closest('.pic')) $('#lb').classList.remove('on'); return; }
  const z=e.target.closest('[data-zoom]'); if(z){openLB(z.dataset.zoom,z.dataset.cap,z.dataset.np);return;}
  const pk=e.target.closest('[data-pk]'); if(pk){photoSel={model:S.model,k:pk.dataset.pk};renderStage(BYID[S.model]);return;}
  const g=e.target.closest('[data-goto]'); if(g){const ser=g.dataset.goto;const el=ser==='TS'?$('#tsTable').closest('.card'):$('#'+ser.toLowerCase()+'Det');if(el.tagName==='DETAILS')el.open=true;el.scrollIntoView({behavior:'smooth',block:'start'});}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#lb').classList.remove('on');});


/* ======================= HAKKINDA ======================= */
function renderAbout(){
  const nCurve=MODELS.filter(m=>baseCurve(m)).length;
  $('#abHero').innerHTML=`<div><span class="eyebrow">${ic('about')}${t('nav_about')}</span><h2>${t('abT')}</h2><div class="lead">${t('abS')}</div>
    <p class="body">${t('abHero')}</p>
    <div class="abchips"><span>${ic('data')}${t('abSt1',{n:MODELS.length})}</span><span>${ic('chart')}${t('abSt2',{n:nCurve})}</span><span>${ic('globe')}${t('abSt3')}</span></div>
    <button class="cta" data-go="calc">${ic('calc')}${t('abCta')} →</button></div>
    <div class="stage" data-zoom="tk" data-cap="${t('serTS')}"><img src="${IMG.tk}" alt=""><span class="tag">RTSVAC</span></div>`;
  const Q=[['wind',''],['gauge',''],['target','good'],['flame','heat'],['bolt','warn'],['scan','gray']];
  $('#abQ').innerHTML=Q.map(([i,c],n)=>`<div class="card qcard"><span class="ico ${c}">${ic(i)}</span><div><h4>${t('q'+(n+1)+'t')}</h4><p>${t('q'+(n+1)+'x')}</p></div></div>`).join('');
  const H=['fan','flame','knife','chart'];
  $('#abSteps').innerHTML=H.map((i,n)=>`<div class="card step"><span class="bgi">${ic(i)}</span><div class="n">${n+1}</div><h4>${t('h'+(n+1)+'t')}</h4><p>${t('h'+(n+1)+'x')}</p></div>`).join('');
  $('#abPages').innerHTML=[['calc','calc'],['scan','scan'],['data','data'],['method','method']].map(([v,i])=>`<div class="card pcard" data-go="${v}"><span class="ico">${ic(i)}</span><h4>${t('nav_'+v)} <span class="muted">→</span></h4><p>${t('pg_'+v)}</p></div>`).join('');
  $('#abSrc').innerHTML=[['data','src1'],['fan','src2'],['grid','src3']].map(([i,k])=>`<div class="srow"><span class="ico gray">${ic(i)}</span><span>${t(k)}</span></div>`).join('');
  $('#abPr').innerHTML=`<h4>${ic('check')}${t('prT')}</h4><p>${t('prX')}</p>`;
}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g)setView(g.dataset.go);});


/* ======================= HIZLI GEZİNME & SONUÇ ÇUBUĞU ======================= */
function renderInav(){
  const items=[['gBlower','fan'],...FIELDS.map(c=>[c.g,c.icon])];
  $('#inav').innerHTML=items.map(([g,i])=>`<button data-sec="${g}" title="${t(g)}">${ic(i)}<span>${t(g)}</span></button>`).join('');
}
function gotoSec(sec){$('#inav').querySelector(`[data-sec="${sec}"]`).click();}
$('#flow').addEventListener('click',e=>{const g=e.target.closest('[data-sec]');if(g)gotoSec(g.dataset.sec);});
$('#inav').addEventListener('click',e=>{
  const b=e.target.closest('[data-sec]');if(!b)return;
  const el=$('#sec-'+b.dataset.sec);if(el.tagName==='DETAILS')el.open=true;
  const box=$('#inputs');
  if(box.scrollHeight>box.clientHeight+2&&getComputedStyle(box).overflowY==='auto') box.scrollTo({top:el.offsetTop-box.offsetTop-62,behavior:'smooth'});
  else el.scrollIntoView({behavior:'smooth',block:'start'});
});
function syncInav(){
  const box=$('#inputs'),inner=box.scrollHeight>box.clientHeight+2&&getComputedStyle(box).overflowY==='auto';
  const ref=inner?box.getBoundingClientRect().top+130:(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--topbar'))||0)+90;
  let cur='gBlower';
  document.querySelectorAll('#inputs [id^="sec-"]').forEach(el=>{if(el.getBoundingClientRect().top<=ref)cur=el.id.slice(4);});
  document.querySelectorAll('#inav button').forEach(b=>b.classList.toggle('on',b.dataset.sec===cur));
}
$('#inputs').addEventListener('scroll',syncInav,{passive:true});

function renderOpbar(){
  const o=OP,el=$('#opbar');
  let h=`<div class="mdl" data-top="1">${thumb(B.m)}<span>${B.m.id}</span>${pill(o,B)}</div>`;
  if(okOP(o)){
    const u=o.util*100,uc=u>100?'crit':u>90?'warn':'';
    const hk=o.Preq>S.hP*1000+1?'warn':'';
    h+=[[t('cFlow'),fmt(o.Qn,0),'Nm³/h',''],[t('cP'),fmt(o.pB,0),'mbar',uc],[t('cV'),fmt(o.vj,0),'m/s',''],[t('sideT'),fmt(o.Tk-273.15,0),'°C',''],[t('cH'),fmt(o.Preq/1000,1),'kW',hk],[t('colL'),pct(fmt(u,0)),'',uc]]
      .map(([l,v,u2,c])=>`<div class="it ${c}"><span>${l}</span><b>${v}${u2?`<small>${u2}</small>`:''}</b></div>`).join('');
  } else h+=`<div class="msg">${o&&o.out?t('stOut')+' · > '+fmt(o.pEnd,0)+' mbar':t('stNone')}</div>`;
  h+=`<div class="top"><button data-top="1" title="↑"><svg class="i" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></svg></button></div>`;
  el.innerHTML=h;
  placeOpbar();
}
function placeOpbar(){
  const el=$('#opbar'),hero=$('#hero');
  if(VIEW!=='calc'||!hero){el.classList.remove('show');return;}
  const wide=innerWidth>1000,hr=hero.getBoundingClientRect();
  if(wide){const r=document.querySelector('.results').getBoundingClientRect();el.style.left=r.left+'px';el.style.width=r.width+'px';}
  const side=document.querySelector('.side');
  document.documentElement.style.setProperty('--topbar',wide?'0px':(side.getBoundingClientRect().height)+'px');
  el.classList.toggle('show',wide?hr.bottom<0:(hr.bottom<0||hr.top>innerHeight));
}
$('#opbar').addEventListener('click',e=>{if(e.target.closest('[data-top]'))window.scrollTo({top:0,behavior:'smooth'});});
addEventListener('scroll',()=>{placeOpbar();if(innerWidth<=1000)syncInav();},{passive:true});
addEventListener('resize',placeOpbar);

/* ======================= OLAYLAR ======================= */
function setView(v){
  VIEW=v;try{localStorage.setItem('blowerAKtab',v);}catch(e){}
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  document.querySelectorAll('.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));
  if(v==='scan')renderScan(); if(v==='calc')drawChart();
  placeOpbar();
  window.scrollTo({top:0});
}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setView(b.dataset.v);});
$('#langs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;LANG=b.dataset.l;try{localStorage.setItem('blowerAKlang',LANG);}catch(e){}applyStatic();update();});
$('#model').addEventListener('change',e=>{S.model=e.target.value;update();});
$('#ownPick').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b){S.model=b.dataset.id;update();}});
$('#freq').addEventListener('input',e=>{S.freq=+e.target.value;update();});
$('#resetBtn').addEventListener('click',()=>{S={...DEF,model:S.model};applyStatic();update();});
$('#chart').addEventListener('mousemove',chartHover);
$('#chart').addEventListener('mouseleave',hideTip);
$('#own3').addEventListener('click',e=>{const c=e.target.closest('[data-id]');if(c){S.model=c.dataset.id;update();}});
$('#serChips').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;const s=b.dataset.s;scanSer.has(s)?scanSer.delete(s):scanSer.add(s);if(!scanSer.size)scanSer.add(s);renderScan();});
$('#onlyOk').addEventListener('change',renderScan);
$('#scanQ').addEventListener('input',renderScan);
$('#scanTable').addEventListener('click',e=>{const th=e.target.closest('th.sort');if(th){const k=th.dataset.k;scanSort=scanSort.k===k?{k,d:-scanSort.d}:{k,d:-1};renderScan();return;}
  const tr=e.target.closest('tr[data-id]');if(tr){S.model=tr.dataset.id;update();setView('calc');}});
$('#themeBtn').addEventListener('click',()=>{const d=document.documentElement;const dark=d.dataset.theme?d.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;d.dataset.theme=dark?'light':'dark';try{localStorage.setItem('blowerAKtheme',d.dataset.theme);}catch(e){}renderMethod();update();});
try{const th=localStorage.getItem('blowerAKtheme');if(th&&!QP.get('theme'))document.documentElement.dataset.theme=th;}catch(e){}
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(drawChart,120);});

applyStatic(); update(); setView(VIEW); syncInav();
if(QP.get('zoom')&&IMG[QP.get('zoom')])openLB(QP.get('zoom'),'',QP.get('zoom').startsWith('np'));
</script>
</body>
